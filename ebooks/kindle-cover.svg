      .step { fill: #f5fbfd; font: 700 25.6px Arial, Helvetica, sans-serif; letter-spacing: 0.48px; }
      .detail { fill: #a9c5d0; font: 400 19.2px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; }
      .footer { fill: #91aebb; font: 700 19.2px Arial, Helvetica, sans-serif; letter-spacing: 1.92px; }
    </style>
  </defs>
  <rect width="1600" height="2560" fill="url(#background)" />
  <rect width="1600" height="2560" fill="url(#dots)" opacity=".46" />
  <circle cx="1408" cy="435.20000000000005" r="448.00000000000006" fill="url(#glow)" />
